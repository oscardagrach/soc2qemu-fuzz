[package]
name = "soc2qemu-fuzz"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[features]
default = ["arm"]
# Exactly one guest architecture; it selects the QEMU target libafl_qemu builds.
arm = ["libafl_qemu/arm"]
aarch64 = ["libafl_qemu/aarch64"]

[profile.release]
debug = true

[dependencies]
libafl = "=0.16.1"
libafl_bolts = "=0.16.1"
libafl_targets = "=0.16.1"
libafl_qemu = { version = "=0.16.1", features = ["systemmode"], default-features = false }
env_logger = "0.11.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
libafl_qemu_build = "=0.16.1"
